aid: latent-health
name: Latent Health
description: 'Latent Health (branded "Latent") is an enterprise pharmacy intelligence
  company that applies a clinical agentic engine to the medication-access workflow
  for hospital and health-system pharmacy teams. The platform spans four stages —
  Identify (care-gap detection, eligibility screening, site-of-care routing), Access
  (prior authorization, clinical review, appeal generation, benefit routing, payer
  outreach), Capture (340B eligibility auditing, leakage analytics, financial dashboards),
  and Engage (patient outreach, queue management, outcomes analytics). It ingests
  patient charts and EHR data, claims, payer policies, and drug labels, and is described
  as chart-native and EHR-agnostic across Epic and Cerner. The company reports deployment
  across 50+ health systems covering 2M+ patients annually, and raised an $80M Series
  A led by Spark Capital and Transformation Capital. Latent Health publishes no public
  developer portal, API reference, or SDKs as of this profile; it is an enterprise
  platform sold to health systems, and its public surface is limited to marketing,
  case studies, press, and a Vanta-hosted trust center.'
